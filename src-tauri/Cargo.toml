[package]
name = "gond-code"
version = "0.2.1"
description = "Gond Code: run AI coding agents side by side in git worktrees."
edition = "2021"
rust-version = "1.85"

[lib]
name = "gond_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# An optimised Gond Code Dev (`bun x tauri build --no-bundle --features dev`): its own identity
# and data, like every debug build. Never bundle it: the installer would be prod's. See src/channel.rs.
dev = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "protocol-asset"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
base64 = "=0.23.1"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
dirs = "=7.0.0"
ulid = "=3.0.0"
schemars = "=1.2.3"
serde_path_to_error = "=0.1.20"
which = "=8.0.6"
regex = "=1.13.1"
sha2 = "=0.10.9"
toml = "=0.9.8"
tempfile = "=3.27.0"
portable-pty = "=0.9.0"
# Each terminal's screen in the terminal host, for a pane that attaches later.
vt100 = "=0.18.1"
# The terminal host's pipe (named pipes on Windows, a Unix socket elsewhere): already in the
# tree through Tauri.
tokio = { version = "=1.54.1", features = ["net", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = "=2.14.1"
# HTTPS for installer downloads: already in the tree via the updater, rustls with
# ring and the platform's certificate store.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
# Official-release fallbacks when winget is missing: GitHub CLI's and Node's zips.
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Speech to text: NVIDIA Parakeet Unified English 0.6B, run locally
# through transcribe.cpp (ggml, built from source: needs CMake). CPU only, no Metal.
transcribe-cpp = { version = "=0.4.1", default-features = false }


[target.'cfg(windows)'.dependencies]
# Answering WebView2's microphone prompt for speech to text (wry's own copy).
webview2-com = "=0.39.1"
# The DWM caption, process trees, the PATH registry edit, the clipboard for a paste,
# Credential Manager for the accounts vault and the sound cues.
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# The app's AppUserModelID (app_id.rs).
windows = { version = "=0.62.2", features = ["Win32_UI_Shell"] }

# Smaller debug builds: line tables keep backtraces readable without full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
