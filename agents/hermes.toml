# Hermes Agent (Nous Research). Only its script, run with -NonInteractive so it doesn't stop at
# `hermes setup`. Everything goes in %LOCALAPPDATA%\hermes (its own Python, Git and uv).
# It starts a gateway by itself (`python -m hermes_cli.main gateway run`), which holds its files.
# See agents/README.md for what each key means.
id = "hermes"
name = "Hermes Agent"
command = "hermes"
icon = "hermes"
changelog = "https://github.com/NousResearch/hermes-agent/releases"
# The Nous Portal's /api/oauth/account: its subscription's gauges.
usage = "hermes"

[install]
script = "https://hermes-agent.nousresearch.com/install.ps1"
script_args = "-NonInteractive"
script_bin = "%LOCALAPPDATA%/hermes/bin"

[update]
self = ["update"]
latest = { github = "NousResearch/hermes-agent" }

[detect]
dirs = ["%LOCALAPPDATA%/hermes/bin"]
script_install = ["/appdata/local/hermes/"]
# `hermes --version` takes over a second (it starts Python).
version_file = { path = "../hermes-agent/install-stamp.json", key = "baseVersion" }
# hermes.exe is a launcher whose own folder Windows reports as %TEMP%; its Python's is right.
cwd_from_child = true

[uninstall]
program = [
    "%LOCALAPPDATA%/hermes/bin",
    "%LOCALAPPDATA%/hermes/hermes-agent",
    "%LOCALAPPDATA%/hermes/tools",
    "%LOCALAPPDATA%/hermes/installs",
]
path = ["%LOCALAPPDATA%/hermes/bin"]
settings = ["%LOCALAPPDATA%/hermes"]
# Its gateway: its own Python, stopped where it runs from its folders.
background = "python.exe"

[resume]
command = "hermes --resume {id}"
flags = ["--resume", "-r"]
# %LOCALAPPDATA%\hermes on Windows, ~/.hermes on Linux.
home = ["$HERMES_HOME", "%LOCALAPPDATA%/hermes", "~/.hermes"]
store = { kind = "sqlite", file = "state.db", query = "SELECT id, cwd, COALESCE(last_activity_at, started_at) FROM sessions" }

[status]
prompts = [
    'allow for this session',
    'add to permanent allowlist',
    'choice \[o/s/a/d\]',
]
# Its Ctrl+V pastes text.
paste = "alt+v"
# Lines its prompts show, as seen on screen: the tests check the patterns above match them.
examples = [
    'Choice [o/s/a/D]: ',
    '  Allow for this session',
]
