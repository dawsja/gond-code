# GitHub Copilot CLI. winget's per-user package (a `copilot` alias), else the npm package through
# Bun (its loader runs on Node). `copilot update` updates the winget install in place.
# See agents/README.md for what each key means.
id = "copilot"
name = "GitHub Copilot"
command = "copilot"
icon = "copilot"
changelog = "https://github.com/github/copilot-cli/releases"
# api.github.com/copilot_internal/user with the sign-in's token (Credential Manager, UTF-16).
usage = "copilot"

[install]
winget = "GitHub.Copilot"
npm = "@github/copilot"
npm_needs_node = true

[update]
self = ["update"]
latest = { npm = "@github/copilot" }

[uninstall]
# winget or Bun remove the program; its settings, sessions and downloaded updates are here.
settings = ["~/.copilot"]

[resume]
command = "copilot --resume={id}"
flags = ["--resume", "-r"]
home = ["$COPILOT_HOME", "~/.copilot"]
# session-state/<id>/workspace.yaml, or exactly the one whose inuse.<pid>.lock names the process.
store = { kind = "reader", name = "copilot" }
