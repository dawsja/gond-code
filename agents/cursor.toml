# Cursor's CLI (`cursor-agent`). Only Cursor's own script, which puts it on the user PATH.
# See agents/README.md for what each key means.
id = "cursor"
name = "Cursor"
command = "cursor-agent"
icon = "cursor"
changelog = "https://cursor.com/changelog"
# DashboardService/GetCurrentPeriodUsage on api2.cursor.sh with the sign-in's access token.
usage = "cursor"

[install]
script = "https://cursor.com/install?win32=true"
script_bin = "%LOCALAPPDATA%/cursor-agent"

[update]
self = ["update"]
# The script names the version it installs: `$version = '2026.10.22-27dcf5f'`.
latest = { script = "https://cursor.com/install?win32=true" }

[detect]
dirs = ["%LOCALAPPDATA%/cursor-agent"]
script_install = ["/appdata/local/cursor-agent/"]

[uninstall]
program = ["%LOCALAPPDATA%/cursor-agent", "%LOCALAPPDATA%/cursor-compile-cache"]
path = ["%LOCALAPPDATA%/cursor-agent"]
# ~\.cursor and %APPDATA%\Cursor are shared with the Cursor editor: only the CLI's own files.
settings = [
    "~/.cursor/cli-config.json",
    "~/.cursor/agent-cli-state.json",
    "~/.cursor/statsig-cache.json",
    "~/.cursor/chats",
    "%APPDATA%/Cursor/auth.json",
]

[resume]
command = "cursor-agent --resume {id}"
flags = ["--resume", "-r"]
home = ["~/.cursor"]
# chats/<hash>/<id>/meta.json
store = { kind = "reader", name = "cursor" }
