# Grok Build (xAI).
# See agents/README.md for what each key means.
id = "grok"
name = "Grok Build"
command = "grok"
icon = "grok"
changelog = "https://x.ai/changelog/build"
# The CLI proxy's /billing (monthly credits, weekly share).
usage = "grok"

[install]
winget = "xAI.GrokBuild"
script = "https://x.ai/cli/install.ps1"
script_bin = "~/.grok/bin"

[update]
self = ["update"]
# Its installer's stable channel pointer: the version and nothing else.
latest = { text = "https://x.ai/cli/stable" }

[detect]
dirs = ["~/.grok/bin"]
script_install = ["/.grok/"]

[uninstall]
# Its program, completions, docs, downloads and bundled Git; the rest of ~\.grok is settings and
# sessions.
program = [
    "~/.grok/bin",
    "~/.grok/completions",
    "~/.grok/docs",
    "~/.grok/downloads",
    "%LOCALAPPDATA%/grok",
]
path = ["~/.grok/bin"]
settings = ["~/.grok"]

[resume]
command = "grok --resume {id}"
flags = ["--resume", "-r"]
home = ["$GROK_HOME", "~/.grok"]
# sessions/<folder>/<id>/summary.json
store = { kind = "reader", name = "grok" }

[status]
# Its title says what it's doing: "⚠ Action Required" when it asks, a spinner while it works.
# (It reports on OSC 7501 too, but only after a support check Windows' console host can't
# answer, and no setting outside its own config turns that on.)
title = "grok"
# Alt+V pastes a screenshot on Windows (its Ctrl+V takes files and text).
paste = "alt+v"
