# Kilo Code's CLI, an opencode fork. winget's KiloCode.Kilo, else the npm package through Bun (a
# Node launcher in front of the native program). No Windows script. `kilo upgrade` doesn't know
# a winget install, so winget updates that. Its account has a credit balance, not a plan.
# See agents/README.md for what each key means.
id = "kilo"
name = "Kilo Code"
command = "kilo"
icon = "kilo"
changelog = "https://github.com/Kilo-Org/kilocode/releases"

[install]
winget = "KiloCode.Kilo"
npm = "@kilocode/cli"
npm_needs_node = true
platform_packages = [
    "@kilocode/cli-windows-x64",
    "@kilocode/cli-windows-x64-baseline",
    "@kilocode/cli-windows-arm64",
]

[update]
# GitHub has its JetBrains releases too: the npm registry is the CLI's.
latest = { npm = "@kilocode/cli" }

[uninstall]
settings = [
    "~/.config/kilo",
    "~/.local/share/kilo",
    "~/.local/state/kilo",
    "~/.cache/kilo",
]

[resume]
command = "kilo --session {id}"
flags = ["--session", "-s"]
home = ["$XDG_DATA_HOME/kilo", "~/.local/share/kilo"]
# opencode's store, as kilo.db.
store = { kind = "sqlite", file = "kilo.db", query = "SELECT id, directory, time_updated FROM session WHERE parent_id IS NULL OR parent_id = ''" }

[status]
prompts = ['^\s*△\s*permission required']
# Lines its prompts show, as seen on screen: the tests check the patterns above match them.
examples = [
    '△ Permission required',
]
