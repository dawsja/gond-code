# Real sign-in on a fresh Windows runner, through Gond's background sign-in (dev.1591):
# each harness's own login must reach its sign-in link. OAuth itself can't finish in CI.
# Manual, or on push to bridge/signin-check-*.
name: Sign-in check

on:
  workflow_dispatch:
  push:
    branches: ["bridge/signin-check-*"]

permissions:
  contents: read

jobs:
  signin:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex]
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder dist
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null; "<!doctype html>" | Out-File dist/index.html
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install ${{ matrix.harness }} with Gond's engine
        working-directory: src-tauri
        env:
          GOND_REAL_HARNESS: ${{ matrix.harness }}
          GOND_REAL_PLAN: "0"
        run: cargo test --lib real_install -- --ignored --nocapture
      - name: Sign in to ${{ matrix.harness }} until the link shows
        working-directory: src-tauri
        env:
          GOND_REAL_HARNESS: ${{ matrix.harness }}
        run: cargo test --lib real_signin_reaches_the_link -- --ignored --nocapture
